<!DOCTYPE html>
<html>
  <head>
    <title>Challenge 17c - Expanded Sidebar</title>
    <style>
      body {
        margin: 0;
        font-family: Roboto, Arial;
        background-color: rgb(249, 249, 249);
      }

      /* Base: Compact Sidebar for screens <= 1200px */
      @media (max-width: 1200px) {
        .sidebar {
          position: fixed;
          left: 0;
          top: 0;
          bottom: 0;
          width: 72px;
          background-color: white;
          border-right: 1px solid rgb(220, 220, 220);
          display: flex;
          flex-direction: column;
          padding-top: 10px;
        }

        .sidebar-link {
          height: 74px;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          cursor: pointer;
        }

        .sidebar-link:hover {
          background-color: rgb(240, 240, 240);
        }

        .icon-box {
          width: 24px;
          height: 24px;
          background-color: #6b7280;
          border-radius: 4px;
          margin-bottom: 4px;
        }

        .label {
          font-size: 10px;
        }

        .main-content {
          margin-left: 96px;
          padding: 20px;
        }
      }

      /* Expanded Sidebar for screens >= 1200.1px */
      @media (min-width: 1200.1px) {
        .sidebar {
          position: fixed;
          left: 0;
          top: 0;
          bottom: 0;
          width: 200px;
          background-color: white;
          border-right: 1px solid rgb(220, 220, 220);
          padding-top: 12px;
        }

        .sidebar-link {
          height: 40px;
          display: flex;
          flex-direction: row;
          align-items: center;
          padding-left: 20px;
          cursor: pointer;
        }

        .sidebar-link:hover {
          background-color: rgb(240, 240, 240);
        }

        .icon-box {
          width: 22px;
          height: 22px;
          background-color: #6b7280;
          border-radius: 4px;
          margin-right: 16px;
        }

        .label {
          font-size: 14px;
        }

        .main-content {
          margin-left: 220px;
          padding: 20px;
        }
      }
    </style>
  </head>
  <body>
    <nav class="sidebar">
      <div class="sidebar-link"><div class="icon-box"></div><div class="label">Home</div></div>
      <div class="sidebar-link"><div class="icon-box"></div><div class="label">Explore</div></div>
      <div class="sidebar-link"><div class="icon-box"></div><div class="label">Subscriptions</div></div>
      <div class="sidebar-link"><div class="icon-box"></div><div class="label">Library</div></div>
    </nav>

    <main class="main-content">
      <h2>Responsive Sidebar Demo</h2>
      <p>Resize your browser window past 1200px to see the sidebar switch between compact (72px) and expanded (200px).</p>
    </main>
  </body>
</html>
