<style>
  .button-container {
    position: relative;
    display: inline-block;
  }
  .btn {
    padding: 8px 16px;
    cursor: pointer;
  }
  .tooltip {
    position: absolute;
    bottom: -30px;
    left: 50%;
    transform: translateX(-50%);
    background-color: gray;
    color: white;
    font-family: Arial;
    font-size: 12px;
    padding: 4px 8px;
    border-radius: 2px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s;
  }
  .button-container:hover .tooltip {
    opacity: 1;
  }
</style>
<div class="button-container">
  <button class="btn">Hover me</button>
  <div class="tooltip">Search button</div>
</div>
