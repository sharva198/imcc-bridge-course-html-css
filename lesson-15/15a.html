<!DOCTYPE html>
<html>
  <head>
    <title>Position Fixed Header</title>
    <style>
      body {
        margin: 0;
        padding-top: 60px;
        height: 1500px;
        font-family: Arial;
      }
      .header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 50px;
        background-color: white;
        border-bottom: 1px solid rgb(220, 220, 220);
        display: flex;
        align-items: center;
        padding: 0 16px;
        z-index: 100;
      }
    </style>
  </head>
  <body>
    <div class="header">Sticky Header (Stays on scroll)</div>
    <p>Scroll down to see the header stay fixed at the top.</p>
  </body>
</html>
